name: Manifests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-manifests:
    name: Verify manifests are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check controller-gen version annotation
        run: |
          make check-controller-gen-version

      - name: Generate manifests
        run: |
          make manifests

      - name: Check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Manifests are out of date. The following files have changes:"
            git status --porcelain
            git diff
            echo "Run 'make manifests' locally and commit the results."
            exit 1
          fi
          echo "Manifests are up to date."
